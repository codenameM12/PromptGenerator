[package]
name = "prompt-studio"
version = "0.1.0"
description = "Local prompt studio for image and video generation targets"
authors = ["Prompt Studio"]
edition = "2024"
# The Tauri webview binary is retired; this crate is now the plain backend
# library consumed by native-ui. src/main.rs is kept only as historical context.
autobins = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "prompt_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
dunce = "1"
url = "2"
windows-dpapi = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
walkdir = "2"
zip = "2"
rusqlite = { version = "0.41.1", features = ["backup", "bundled"] }
blake3 = "1"
uuid = { version = "1.29.0", features = ["v7"] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-clipboard-manager = "2.5.0"
base64 = "0.23.1"
png = "0.18.1"
image = "0.25"
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "ndarray", "download-binaries"] }
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
kamadak-exif = "0.6.1"
percent-encoding = "2.3.2"
async-trait = "0.1.92"
futures-util = "0.3.34"
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
csv = "1.4.0"
encoding_rs = "0.8.44"
tauri-plugin-drag = "2.1.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
